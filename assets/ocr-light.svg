<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="On-screen credits reader"><title>On-screen credits reader</title><desc>Credits roll on a dark frame and each text line is boxed as it is read. On the timeline below, the text run is kept because it reaches the end of the file, and a run that stops early is refused.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f4fb"/></linearGradient><radialGradient id="glow0" cx="0" cy="0" r="0.75"><stop offset="0" stop-color="#d98200" stop-opacity="0.1"/><stop offset="1" stop-color="#d98200" stop-opacity="0"/></radialGradient><radialGradient id="glow1" cx="1" cy="1" r="0.75"><stop offset="0" stop-color="#0b9d8c" stop-opacity="0.1"/><stop offset="1" stop-color="#0b9d8c" stop-opacity="0"/></radialGradient><linearGradient id="g-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9480f6"/><stop offset="1" stop-color="#6a4ff2"/></linearGradient><linearGradient id="h-violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a4ff2"/><stop offset="1" stop-color="#8b76f5"/></linearGradient><linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb8ac"/><stop offset="1" stop-color="#0b9d8c"/></linearGradient><linearGradient id="h-teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b9d8c"/><stop offset="1" stop-color="#41b3a5"/></linearGradient><linearGradient id="g-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ea7588"/><stop offset="1" stop-color="#e2405a"/></linearGradient><linearGradient id="h-coral" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2405a"/><stop offset="1" stop-color="#e86a7e"/></linearGradient><linearGradient id="g-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4a547"/><stop offset="1" stop-color="#d98200"/></linearGradient><linearGradient id="h-amber" x1="0" y1=